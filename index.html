<style>
  :root {

  @media (prefers-color-scheme: dark) {

  }
  :root[data-theme="dark"] {

    --glacier: #8FBCE3; --area: #24435A; --sel: #FF6B5E; --hdr: rgba(19,33,44,.88);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }

  h1, h2, .num, .brand { font-family: "Barlow Condensed", "Barlow", sans-serif; }

  /* Capçalera */
  header {

    padding-top: env(safe-area-inset-top, 0px);
    background: var(--hdr); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line);

  .bar { height: var(--hh); max-width: 1100px; margin: 0 auto; padding: 0 1.25rem; display: flex; align-items: center; gap: .75rem; }
  .brand { font-weight: 700; font-size: 1.25rem; color: var(--ink); text-decoration: none; margin-right: auto; white-space: nowrap; }

          background: var(--panel); color: var(--ink); cursor: pointer; padding: 0; }
  .home svg { width: 18px; height: 18px; }
  .navlink { color: var(--ink); text-decoration: none; font-weight: 500; font-size: .95rem; padding: 0 .3rem;
             height: 36px; display: inline-flex; align-items: center; }
  .langs { display: flex; height: 36px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .langs button { height: 100%; display: inline-flex; align-items: center; }

  /* Mapa */
  .layout { display: flex; flex-direction: column; }

  .qnav { display: flex; gap: .4rem; margin-left: auto; }

  .head { flex-wrap: nowrap; }

  .photos { margin: 0 0 1.1rem; }
  .ph { font: 600 1.3rem "Barlow Condensed", sans-serif; margin: 0 0 .6rem; }
  .strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; }

  @media (min-width: 600px) { .strip, .strip.grid { grid-template-columns: repeat(4, 1fr); } }
  .ph-i { position: relative; display: block; padding: 0; border: 0; border-radius: 10px; overflow: hidden; cursor: zoom-in;
          aspect-ratio: 1; background: var(--area); }

        padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); touch-action: pan-y; }
  .lb[hidden] { display: none; }

  .lb-fig img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #0b1520; user-select: none; -webkit-user-drag: none; }
  .lb-fig figcaption { display: flex; align-items: center; gap: .8rem; padding: 0 1rem; color: #E4ECF1; }
  .lb-t { display: grid; min-width: 0; margin-right: auto; }
  .lb-d { font: 600 1.15rem "Barlow Condensed", sans-serif; }
  .lb-r { font-size: .82rem; color: #9FB2C0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-n { font-size: .82rem; color: #9FB2C0; white-space: nowrap; }
  .lb-go { background: #E4ECF1; color: #15232F; border: 0; border-radius: 999px; padding: .45rem .85rem;
           font: 500 .85rem "Barlow", sans-serif; cursor: pointer; white-space: nowrap; }
  .lb-x, .lb-a { position: absolute; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px;
                 border: 0; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; padding: 0; }
  .lb-x { top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; }
  .lb-a { top: 50%; transform: translateY(-50%); }
  .lb-p { left: 10px; } .lb-nx { right: 10px; }
  .lb-x svg, .lb-a svg { width: 22px; height: 22px; }
  :is(.lb-x, .lb-a, .lb-go):focus-visible { outline: 3px solid #8FBCE3; outline-offset: 2px; }
  @media (max-width: 600px) { .lb-a { top: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: none; } }
  .files { margin: 0 0 1.6rem; }
  .files[hidden] { display: none; }
  .fp { display: inline-block; margin-top: .6rem; color: var(--glacier); font-weight: 600; }
  .files h3 { font: 600 1.3rem "Barlow Condensed", sans-serif; margin: 0 0 .6rem; }
  .file-list { display: grid; gap: .5rem; }
  .file { display: flex; align-items: center; gap: .8rem; padding: .7rem .9rem; border: 1px solid var(--line); border-radius: 12px;
          background: var(--panel); color: var(--ink); text-decoration: none; }
  .file:hover { border-color: var(--glacier); }
  .file:focus-visible { outline: 3px solid var(--glacier); outline-offset: 2px; }
  .file svg { width: 22px; height: 22px; flex: none; color: var(--glacier); }

  .howto { margin-top: .6rem; font-size: .92rem; }
  .howto summary { cursor: pointer; color: var(--glacier); font-weight: 500; padding: .3rem 0; }
  .howto ol { margin: .4rem 0 0; padding-left: 1.3rem; }
  .howto li + li { margin-top: .3rem; }
  #prof { touch-action: pan-y; cursor: crosshair; }
  .hov-t { font: 600 15px "Barlow", sans-serif; }
  #map { position: absolute; inset: 0; background: var(--area); }

  .alt-btn { width: 34px; height: 34px; display: grid; place-items: center; padding: 0; cursor: pointer;

  .hero.fs .play-wrap { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .peak { display: flex; align-items: center; justify-content: center; color: #4B3B2E; font-size: 13px; line-height: 1;
          text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 2px #fff; }
  .plbl { background: rgba(255,255,255,.85); border: 0; box-shadow: none; border-radius: 4px; padding: 0 5px;

  .lock svg { width: 16px; height: 16px; }
  .hero.locked .leaflet-control-zoom { display: none; }
  .leaflet-container { font: inherit; }
  .leaflet-control-attribution.leaflet-control {
    background: rgba(255,255,255,.55); font-size: 9px; line-height: 1.4; padding: 0 5px; margin: 0;

  }

  .lbl::before { display: none; }
  .ebc { color: #C62828; font-size: 26px; line-height: 26px; text-align: center; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }

  /* Corda de banderes */
  .rope { position: relative; padding: 1.1rem 0 .4rem; overflow-x: auto; scrollbar-width: none; }
  .rope::-webkit-scrollbar { display: none; }
  .rope-inner { position: relative; display: flex; gap: 6px; padding: 0 1.25rem 18px; width: max-content; min-width: 100%; justify-content: center; }
  .marker { position: absolute; top: 66px; left: 0; width: 0; height: 0; pointer-events: none;
            border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 9px solid var(--ink);
            transform: translateX(-50%); transition: left .25s ease; }
  .rope-inner::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--ink-soft); opacity: .5; }
  .flag { width: 42px; height: 52px; border: 0; padding: 0; cursor: pointer;
          clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%);
          font: 600 1.05rem/1 "Barlow Condensed", sans-serif; color: #15232F; transform-origin: top center; transition: transform .2s ease; }
  .flag.c0 { background: var(--f-blue); color: #fff; }
  .flag.c1 { background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 52' preserveAspectRatio='none'><polygon points='0.8,0.8 41.2,0.8 41.2,51.2 21.0,44.24 0.8,51.2' fill='%23F4F4EE' stroke='%23AEB8C0' stroke-width='1.6' stroke-linejoin='round'/></svg>") center / 100% 100% no-repeat; }
  .flag.c2 { background: var(--f-red); color: #fff; }
  .flag.c3 { background: var(--f-green); color: #fff; }
  .flag.c4 { background: var(--f-yellow); }
  .flag.c1, .flag.allf, .mf.c1, .mf.allf { clip-path: none; }
  .flag.allf { width: 58px; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 58 52' preserveAspectRatio='none'><polygon points='2.0,2.0 56.0,2.0 56.0,50.0 29.0,43.519999999999996 2.0,50.0' fill='%23DC143C' stroke='%23003893' stroke-width='4' stroke-linejoin='round'/></svg>") center / 100% 100% no-repeat; color: #fff; font-size: .95rem; margin-right: 6px; }
  .flag { transition: transform .2s ease, opacity .2s ease, filter .2s ease; }
  .rope-inner.has-sel .flag:not([aria-pressed="true"]) { opacity: .42; filter: saturate(.6); }
  .rope-inner.has-sel .flag:not([aria-pressed="true"]):hover { opacity: .8; }
  .flag[aria-pressed="true"] { opacity: 1; }
  /* mini bandera de la fitxa */
  .mf { display: inline-block; width: 16px; height: 21px; margin-right: 10px; vertical-align: -1px;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); }

  .mf.c2 { background: var(--f-red); } .mf.c3 { background: var(--f-green); } .mf.c4 { background: var(--f-yellow); }
  .mf.allf { background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 21' preserveAspectRatio='none'><polygon points='1.0,1.0 15.0,1.0 15.0,20.0 8.0,17.459999999999997 1.0,20.0' fill='%23DC143C' stroke='%23003893' stroke-width='2' stroke-linejoin='round'/></svg>") center / 100% 100% no-repeat; }
  .pin { border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); }

  .pin.b { background: #DC143C; }
  .flag:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .hint { margin: .2rem 1.25rem 0; font-size: .85rem; color: var(--ink-soft); text-align: center; }

  /* Fitxa */
  main { max-width: 760px; margin: 0 auto; padding: 1rem 1.25rem 2.5rem; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

         padding: .35rem .9rem; font: 500 .9rem "Barlow", sans-serif; cursor: pointer; }
  /* Estadístiques: el contenidor mesura l'amplada i la tipografia s'hi adapta */
  .stats { container-type: inline-size; margin: 1.1rem 0; background: var(--panel); border: 1px solid var(--line);
           border-radius: 12px; padding: .8rem 0; overflow: hidden; }
  .sg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: .8rem; }
  .stat { padding: 0 clamp(.35rem, 2cqi, .8rem); border-left: 1px solid var(--line); min-width: 0; }
  .stat:first-child { border-left: 0; }
  .stat .num { font: 600 clamp(1.05rem, 6.4cqi, 1.8rem)/1.05 "Barlow Condensed", sans-serif; white-space: nowrap;
               overflow: hidden; text-overflow: clip; }
  .stat .num small { font-size: .55em; font-weight: 500; margin-left: .12em; color: var(--ink-soft); }
  .stat .lab { font-size: clamp(.68rem, 2.6cqi, .82rem); line-height: 1.2; color: var(--ink-soft); margin-top: .3rem;
               overflow-wrap: anywhere; hyphens: auto; }
  [data-theme="exp"] .stat .num { font-size: clamp(.95rem, 4.9cqi, 1.6rem); letter-spacing: -.02em; }
  [data-theme="exp"] .stat .num small { font-size: .6em; letter-spacing: 0; }
  /* massa estret per a 4 columnes: 2 × 2 */
  @container (max-width: 330px) {
    .sg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat:nth-child(3) { border-left: 0; }
    .stat .num { font-size: clamp(1.1rem, 11cqi, 1.6rem); }
    [data-theme="exp"] .stat .num { font-size: clamp(1rem, 9cqi, 1.45rem); }
    .stat .lab { font-size: .74rem; }
  }
  .profile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .8rem .6rem .4rem; }
  .profile svg { display: block; width: 100%; height: auto; }
  .profile .cap { margin: 0 .35rem .3rem; font-size: .85rem; color: var(--ink-soft); }
  .night { margin: 1rem 0 0; }
  .actions { display: flex; gap: .5rem; margin-top: 1.1rem; }
  .btn { flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
         min-height: 46px; border-radius: 999px; padding: .5rem .9rem; font: 500 .95rem "Barlow", sans-serif;

// ---------- Fotos ----------

// Visor

const stat = (n, u, l) => `<div class="stat"><div class="num">${n}${u ? `<small>${u}</small>` : ""}</div><div class="lab">${l}</div></div>`;
function render(fly) {

}
function go(day, fromHash) {
  cur = day; render(true);
  const want = day ? "#dia-" + day : "";
  if (!fromHash && location.hash !== want) history.replaceState(null, "", want || location.pathname + location.search);
}
function applyLang() {

  document.title = `${L_.title} · 2026`;
  $("h1").textContent = L_.title; $("sub").textContent = L_.sub; $("fp").textContent = L_.fp;
  $("navStages").textContent = L_.stages; $("home").setAttribute("aria-label", L_.home); $("home").title = L_.home; $("hint").textContent = L_.hint;
  $("map").setAttribute("aria-label", L_.map); $("prof").setAttribute("aria-label", L_.prof);
  $("all").textContent = L_.all; setBtn($("dl"), DL_SVG, L_.dl, L_.sDl);

  paintLayers(); paintTheme(); paintFS(); paintFiles(); paintPlay(); paintPeaks(); paintShare();

  setLock(unlocked); render(false);

// ---------- Tema clar / fosc ----------
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const sysDark = matchMedia("(prefers-color-scheme: dark)");
const COMPASS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>';
const curTheme = () => { const f = document.documentElement.dataset.theme; return f || (sysDark.matches ? "dark" : "light"); };
const isDark = () => curTheme() === "dark";
const TH_ICON = { light: SUN, dark: MOON, exp: COMPASS };
function paintTheme() {
  const th = curTheme(), b = $("theme"), L_ = t();
  b.innerHTML = TH_ICON[th];
  b.setAttribute("aria-label", `${L_.thTitle}: ${L_["th" + th[0].toUpperCase() + th.slice(1)]}`); b.title = b.getAttribute("aria-label");
  document.querySelectorAll("#thmMenu button").forEach(x => {
    const k = x.dataset.th; x.innerHTML = TH_ICON[k] + `<span>${L_["th" + k[0].toUpperCase() + k.slice(1)]}</span>`;
    x.setAttribute("aria-checked", String(k === th));

function openThm(o) { $("thmMenu").hidden = !o; $("theme").setAttribute("aria-expanded", String(o)); if (o) $("thmMenu").querySelector('[aria-checked="true"]')?.focus(); }
$("theme").onclick = () => openThm($("thmMenu").hidden);
document.querySelectorAll("#thmMenu button").forEach(x => x.onclick = () => {

document.addEventListener("click", e => { if (!$("thmMenu").hidden && !e.target.closest(".thm")) openThm(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("thmMenu").hidden) { openThm(false); $("theme").focus(); } });

// ---------- Pantalla completa ----------
let fsOn = false, lockBefore = false;

  if (on && hero.requestFullscreen && !document.fullscreenElement) hero.requestFullscreen().catch(() => {});
  if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  paintFS();
  setTimeout(() => map.invalidateSize(), 60);
}

document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && fsOn) setFS(false); });
addEventListener("keydown", e => { if (e.key === "Escape" && fsOn) setFS(false); });

document.querySelectorAll(".langs button").forEach(b => b.onclick = () => {

function goHome(e) { if (e) e.preventDefault(); setFS(false); setLock(false); go(0); scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); }
$("brand").onclick = goHome; $("home").onclick = goHome;
$("all").onclick = () => go(0);
const mobile = matchMedia("(max-width: 899px)");
function showMap() {
  if (!mobile.matches || fsOn) return;
  const r = hero.getBoundingClientRect(), top = $("brand").closest("header").getBoundingClientRect().bottom;
  if (r.top < top - 1 || r.bottom > innerHeight + 1) hero.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
}
function pick(d) { stopPlay(); go(d); showMap(); }
$("prev").onclick = () => pick(Math.max(0, cur - 1));
$("next").onclick = () => pick(Math.min(S.length, cur + 1));
$("prev2").onclick = () => pick(Math.max(0, cur - 1));

const CHEV_L = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>';
const CHEV_R = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>';
function where(s) { return s.kind ? t().accl : s.sleep; }

}
